<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Websites</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: { primary: "#137fec", "background-light": "#f6f7f8", "background-dark": "#101922" },
            fontFamily: { display: ["Inter"] },
            borderRadius: { full: "9999px" },
          },
        },
      };
    </script>
    <script>
      try{document.documentElement.classList.toggle('dark', (localStorage.theme ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'))==='dark');}catch(e){}
    </script>
  </head>
  <body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
    <header class="py-6 border-b border-black/5 dark:border-white/5">
      <div class="max-w-6xl mx-auto px-4 md:px-6 flex items-center justify-between">
        <a href="index.html" class="text-sm text-primary hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-primary rounded">← Back</a>
        <h1 class="text-xl font-bold">ウェブサイト一覧</h1>
        <span></span>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 md:px-6 py-8">
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </main>

    <template id="card-template">
      <article class="bg-white dark:bg-black/20 border border-black/5 dark:border-white/10 shadow-sm rounded-2xl overflow-hidden flex flex-col">
        <img class="h-40 w-full object-cover" alt="" loading="lazy" decoding="async" />
        <div class="p-4 flex flex-col gap-3">
          <h2 class="font-semibold text-base"></h2>
          <div class="flex flex-col gap-2">
            <a role="button" target="_blank" rel="noopener noreferrer" class="btn-view inline-flex items-center justify-center text-white hover:brightness-110 active:brightness-95 rounded-xl px-4 py-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-background-light dark:focus-visible:ring-offset-background-dark" style="background-color:#013d9b">体験する</a>
            <a role="button" target="_blank" rel="noopener noreferrer" class="btn-learn inline-flex items-center justify-center bg-white dark:bg-transparent rounded-xl px-4 py-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-background-light dark:focus-visible:ring-offset-background-dark" style="color:#013d9b;border:1px solid #013d9b">コードを学ぶ</a>
          </div>
        </div>
      </article>
    </template>

    <script>
      const GITHUB_URL = 'https://github.com/';
      function makeCard({ title, thumb, demo }) {
        const node = document.getElementById('card-template').content.firstElementChild.cloneNode(true);
        node.querySelector('img').src = thumb;
        node.querySelector('img').alt = title + ' thumbnail';
        node.querySelector('h2').textContent = title;
        node.querySelector('.btn-view').href = demo;
        node.querySelector('.btn-learn').href = GITHUB_URL;
        return node;
      }

      fetch('data/projects.json')
        .then((r) => r.json())
        .then(({ webs }) => {
          const grid = document.getElementById('grid');
          grid.innerHTML = '';
          (webs||[]).filter(p=>p.published===true).forEach((p) => grid.appendChild(makeCard(p)));
        })
        .catch(() => {
          document.getElementById('grid').innerHTML = '<p class="text-sm text-gray-500">No web projects to show.</p>';
        });
    </script>
  </body>
</html>
